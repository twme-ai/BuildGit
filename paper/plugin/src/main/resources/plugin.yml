name: BuildGit
version: "${version}"
main: dev.twme.buildgit.paper.BuildGitPlugin
api-version: "1.21"
# 這個 jar 對應的 Minecraft 版本；伺服器版本不同時插件會自行停用
buildgit-minecraft: "${minecraft}"
description: 給建築伺服器的版本控制：只記玩家造成的變更，像 git 一樣存檔、比較與還原。
website: https://twme.dev
libraries:
  - com.github.luben:zstd-jni:${zstd}
softdepend: [WorldEdit, FastAsyncWorldEdit, AxiomPaper]
permissions:
  buildgit.view:
    description: 查看狀態、歷史、存檔內容與方塊來源
    default: op
  buildgit.inspect:
    description: 檢查模式
    default: op
    children:
      buildgit.view: true
  buildgit.save:
    description: 存檔
    default: op
    children:
      buildgit.view: true
  buildgit.mark:
    description: 手動補記範圍
    default: op
  buildgit.go:
    description: 進出草稿世界（go、back）
    default: op
  buildgit.try:
    description: 開草稿
    default: op
    children:
      buildgit.go: true
      buildgit.save: true
  buildgit.sync:
    description: 把選取範圍帶到單人世界、把改過的範圍送回成草稿（pull、push）
    default: op
    children:
      buildgit.try: true
  buildgit.publish:
    description: 把草稿併回
    default: op
    children:
      buildgit.try: true
  buildgit.commit:
    description: 以自訂訊息存檔（里程碑）
    default: op
    children:
      buildgit.save: true
  buildgit.branch.create:
    description: 建立分支（不傳送）
    default: op
  buildgit.branch.delete:
    description: 刪除草稿與它的世界
    default: op
  buildgit.merge:
    description: 底層合併任意分支、處理衝突整合
    default: op
    children:
      buildgit.publish: true
  buildgit.revert:
    description: 撤銷某次存檔
    default: op
    children:
      buildgit.save: true
  buildgit.restore:
    description: 把分支或範圍還原到舊版本
    default: op
    children:
      buildgit.save: true
  buildgit.admin:
    description: 初始化、重新載入與所有權限
    default: op
    children:
      buildgit.save: true
      buildgit.commit: true
      buildgit.inspect: true
      buildgit.mark: true
      buildgit.publish: true
      buildgit.sync: true
      buildgit.merge: true
      buildgit.revert: true
      buildgit.restore: true
      buildgit.branch.create: true
      buildgit.branch.delete: true
