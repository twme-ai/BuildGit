name: BuildGit
version: "${version}"
main: dev.twme.buildgit.paper.BuildGitPlugin
api-version: "1.21"
# 這個 jar 對應的 Minecraft 版本；伺服器版本不同時插件會自行停用
buildgit-minecraft: "${minecraft}"
description: 給建築伺服器的版本控制：只記玩家造成的變更，像 git 一樣存檔、比較與還原。
website: https://twme.dev
libraries:
  - com.github.luben:zstd-jni:${zstd}
softdepend: [WorldEdit, FastAsyncWorldEdit, AxiomPaper, DebugStickPro]
# 包含關係（權限集、哪個節點帶出哪些節點）在程式裡判斷（PermissionSets），兩個平台相同，所以這裡不寫 children。
permissions:
  buildgit.role.viewer:
    description: 權限集：看歷史與方塊來源、進出草稿與舊版本，不能改
    default: op
  buildgit.role.builder:
    description: 權限集：viewer＋開草稿、存檔、帶到單人世界改；不能併回主世界
    default: op
  buildgit.role.manager:
    description: 權限集：builder＋併回、撤銷、還原、處理衝突、建立與刪除草稿、手動補記
    default: op
  buildgit.admin:
    description: 全部權限，加上 init、reload、disk
    default: op
  buildgit.view:
    description: 查看狀態、歷史、存檔內容與方塊來源
    default: op
  buildgit.inspect:
    description: 檢查模式（含 view）
    default: op
  buildgit.go:
    description: 進出草稿世界、唯讀看舊版本（go、back、view）
    default: op
  buildgit.save:
    description: 存檔（含 view）
    default: op
  buildgit.try:
    description: 開草稿（含 go、save）
    default: op
  buildgit.sync:
    description: 把選取範圍帶到單人世界、把改過的範圍送回成草稿（pull、push；含 try）
    default: op
  buildgit.publish:
    description: 把草稿併回（含 try）
    default: op
  buildgit.commit:
    description: 以自訂訊息存檔（含 save）
    default: op
  buildgit.merge:
    description: 底層合併任意分支、處理衝突整合（含 publish）
    default: op
  buildgit.revert:
    description: 撤銷某次存檔（含 save）
    default: op
  buildgit.restore:
    description: 把分支或範圍還原到舊版本（含 save）
    default: op
  buildgit.mark:
    description: 手動補記範圍
    default: op
  buildgit.branch.create:
    description: 建立分支（不傳送）
    default: op
  buildgit.branch.delete:
    description: 刪除草稿與它的世界
    default: op
