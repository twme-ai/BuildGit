name: BuildGit
version: "${version}"
main: dev.twme.buildgit.paper.BuildGitPlugin
api-version: "1.21"
# The Minecraft version this jar is for; the plugin disables itself on a different server version
buildgit-minecraft: "${minecraft}"
description: "Version control for build servers: records only the changes players make, and saves, compares and restores them like git."
website: https://twme.dev
libraries:
  - com.github.luben:zstd-jni:${zstd}
softdepend: [WorldEdit, FastAsyncWorldEdit, AxiomPaper, DebugStickPro, LuckPerms]
# One node per command, none containing another; which sets include which is decided in code (PermissionSets), the same on both platforms, so there are no children here.
permissions:
  buildgit.role.viewer:
    description: "Permission set: view history and block sources, enter and leave drafts and old versions; no changes"
    default: op
  buildgit.role.builder:
    description: "Permission set: viewer + open drafts, save, take areas to single-player; cannot merge into main"
    default: op
  buildgit.role.manager:
    description: "Permission set: builder + merge, revert, restore, resolve conflicts, create and delete drafts, mark manually"
    default: op
  buildgit.admin:
    description: "Permission set: manager + init, reload, disk, genesis, backup, world.admin"
    default: op
  buildgit.menu:
    description: "Open the menu when typing just /bg"
    default: op
  buildgit.status:
    description: "Current branch and unsaved changes (status), autosave notices"
    default: op
  buildgit.log:
    description: "Save history (log)"
    default: op
  buildgit.diff:
    description: "Show differences in the world (diff)"
    default: op
  buildgit.inspect:
    description: "Inspect mode (inspect)"
    default: op
  buildgit.sel:
    description: "Selection without WorldEdit (sel)"
    default: op
  buildgit.go:
    description: "Go to a draft or main (go)"
    default: op
  buildgit.back:
    description: "Go back to the source world (back)"
    default: op
  buildgit.view:
    description: "View an old version read-only (view)"
    default: op
  buildgit.try:
    description: "Open a draft (try)"
    default: op
  buildgit.save:
    description: "Save (save)"
    default: op
  buildgit.pull:
    description: "Take the selection to single-player (pull)"
    default: op
  buildgit.push:
    description: "Send an area changed in single-player back as a draft (push)"
    default: op
  buildgit.publish:
    description: "Merge a draft back (publish)"
    default: op
  buildgit.merge:
    description: "Low-level merge of any branch (merge <branch>)"
    default: op
  buildgit.merge.resolve:
    description: "Resolve conflicts (merge view, take, continue, abort and so on)"
    default: op
  buildgit.revert:
    description: "Revert a save (revert)"
    default: op
  buildgit.restore:
    description: "Restore a branch or area to an old version (restore)"
    default: op
  buildgit.mark:
    description: "Mark an area manually (mark)"
    default: op
  buildgit.branch.list:
    description: "List drafts (branch list)"
    default: op
  buildgit.branch.delete:
    description: "Delete a draft and its world (branch delete)"
    default: op
  buildgit.init:
    description: "Put the current world under version control (init)"
    default: op
  buildgit.reload:
    description: "Reload settings and language files (reload)"
    default: op
  buildgit.disk:
    description: "Disk space used by BuildGit (disk)"
    default: op
  buildgit.genesis:
    description: "Rewrite the genesis world in the current version's format (genesis upgrade)"
    default: op
  buildgit.backup:
    description: "Offsite backup status, back up now, list snapshots (backup)"
    default: op
  buildgit.world.create:
    description: "Create your own build worlds (new, needs player-worlds.enabled), go back to the server world (home)"
    default: op
  buildgit.world.admin:
    description: "Create, enter, leave and list build worlds (new, open, home, worlds); also manage all build worlds"
    default: op
