# BuildGit backup jobs: each job decides what to back up, where to, when, and how many copies to keep.
# The S3 connections (URLs, keys) are in s3.yml; this file has no keys. Plugin updates never change this file.
# Run /bg reload after changes; /bg backup status shows the state, /bg backup now [job] runs right away.
#
# Settings of each job:
#   what          history: version history (saves, branches, genesis world); world: world folders (player data, maps, unsaved changes...)
#   target        s3:<connection name in s3.yml>, or local:<folder> (relative to the server root, or absolute)
#   path          the place inside the destination (the S3 prefix); give each server or job sharing a destination its own name
#   schedule      cron schedule "minute hour day month weekday", e.g. "0 * * * *" every hour, "0 4 * * *" daily at 4:00, "*/30 * * * *" every 30 minutes
#   idle-minutes  back up once after the server has had no players for this many minutes (only if someone joined since the last backup); 0 turns it off
#                 you can set just one of schedule and idle-minutes, or both
#   keep          how many snapshots to keep
#   enabled       false pauses this job
#   exclude-worlds worlds not to back up: world folders (relative to the server root, e.g. world_nether) or build worlds as "owner/name",
#                 e.g. [world_nether, "alice/test"]. History jobs can only exclude build worlds. Build worlds match by their current name, so update it after a rename
# History jobs also have:
#   genesis-hours when genesis world files already sent have changed, resend them at most every this many hours (default 24; 0 every time). In large lazily copied worlds
#                 region files keep changing as players explore, and resending them all every time costs a lot of traffic. Snapshots in between reuse what was sent last, and new files are sent every time as usual
# World folder jobs also have:
#   storage       auto: folders for local; versioned for S3 when the bucket has versioning on, hashed when not
#                 folders: one complete folder per snapshot that any tool can use directly (local copies use hard links and take no space)
#                 versioned: S3 only, uses the bucket's versioning and only stores changed files again
#                 hashed: files are named by the hash of their content, so the same content is stored once; restore with BuildGit
#   announce      tell players in chat when it starts and ends (not when nobody is online)
#   exclude       extra paths not to back up (relative to the server root, * wildcard), e.g. "world/stats/*"
# World folder jobs only handle worlds someone has been in since the last backup; worlds nobody has ever been in are not backed up.
# A local backup on the same disk only protects against mistakes and corruption, not against the disk failing.

# The time zone for cron, e.g. Europe/Berlin; empty uses the server's time zone
timezone: ""

jobs:
  history-s3:
    what: history
    target: s3:default
    path: buildgit
    schedule: "0 * * * *"
    keep: 48
    enabled: true
  world-s3:
    what: world
    target: s3:default
    path: buildgit-world
    schedule: "0 4 * * *"
    idle-minutes: 10
    keep: 14
    storage: auto
    announce: true
    exclude: []
    enabled: true
  # Example: keep 4 copies of the world folders on another local disk every 6 hours
  # world-local:
  #   what: world
  #   target: local:/mnt/backup/minecraft
  #   schedule: "0 */6 * * *"
  #   keep: 4
