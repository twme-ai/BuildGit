world-create-body: "<gray>The type only decides which vanilla dimension the sky and environment look like (Nether: red ceiling, water evaporates, beds explode; End: black sky, no dragon); every build world is your own separate world. The Build rules fix the time at noon and the weather clear, peaceful, no mob spawning, no crop growth, no fire spread, mobs don't break blocks. Large biomes and amplified are Overworld only. Type, terrain and seed can't be changed later.<newline><newline>Superflat layers are written bottom to top, separated by commas; <white>count*block</white> stacks that many, and a biome may follow a semicolon. Custom layers start at the bottom of the world (y=-64 in the Overworld). Examples:<newline><white>bedrock,2*dirt,grass_block</white>: bedrock, 2 dirt, grass<newline><white>bedrock,3*stone,sandstone,sand;desert</white>: desert<newline><white>bedrock,124*air,stone</white>: stone floor at y=61</gray>"
