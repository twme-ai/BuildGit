prefix: "<dark_aqua>[BuildGit]</dark_aqua> "

help: |-
  <gray>Drafts:</gray>
  <aqua>/bg try <name></aqua> <gray>— open a draft and teleport to the same spot</gray>
  <aqua>/bg publish [--selection]</aqua> <gray>— preview publishing (click to confirm); --selection publishes only the selection</gray>
  <aqua>/bg back</aqua> <gray>— return to the source world without publishing</gray>
  <aqua>/bg go <draft|main></aqua> <gray>— go to a draft or the main world</gray>
  <aqua>/bg branch list|create|delete</aqua> <gray>— manage drafts</gray>
  <gray>Saves and history:</gray>
  <aqua>/bg status</aqua> <gray>— unsaved changes</gray>
  <aqua>/bg save [message]</aqua> <gray>— save a milestone</gray>
  <aqua>/bg log [page] [--all] [--author <player>]</aqua> <gray>— history</gray>
  <aqua>/bg graph [page] [--all]</aqua> <gray>— branch history graph (like git log --graph)</gray>
  <aqua>/bg show <save> [--cells]</aqua> <gray>— what a save changed</gray>
  <aqua>/bg diff [save] [save]</aqua> <gray>— outline changes in the world</gray>
  <aqua>/bg view <save></aqua> <gray>— look at an old version (read-only)</gray>
  <aqua>/bg inspect</aqua> <gray>/</gray> <aqua>/bg blame</aqua> <gray>— who changed a block</gray>
  <gray>Undo:</gray>
  <aqua>/bg revert <save></aqua> <gray>— undo one save, keep later changes</gray>
  <aqua>/bg restore <save> [--selection]</aqua> <gray>— restore the branch or a selection to an old version</gray>
  <gray>Single-player (BuildGit on the client):</gray>
  <aqua>/bg pull <name></aqua> <gray>— take the selection to single-player</gray>
  <aqua>/bg load <name></aqua> <gray>— place a pulled area in a single-player world</gray>
  <aqua>/bg push <name> [draft]</aqua> <gray>— send the edited area back as a draft</gray>
  <gray>Conflicts:</gray>
  <aqua>/bg merge conflicts|goto|take|continue|abort</aqua> <gray>— resolve conflicts</gray>
  <gray>Other:</gray>
  <aqua>/bg sel pos1|pos2|show|clear</aqua> <gray>— selection (uses WorldEdit's when installed)</gray>
  <aqua>/bg who</aqua> <gray>— who is in which draft</gray>
  <aqua>/bg mark <x1> <y1> <z1> <x2> <y2> <z2></aqua> <gray>— record a region manually</gray>
  <aqua>/bg disk</aqua> <gray>— disk space used by BuildGit (admin)</gray>
  <aqua>/bg init</aqua> <gray>/</gray> <aqua>/bg reload</aqua> <gray>— admin</gray>
