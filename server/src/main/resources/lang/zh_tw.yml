prefix: "<dark_aqua>[BuildGit]</dark_aqua> "

help: |-
  <gray>草稿：</gray>
  <aqua>/bg try <名稱></aqua> <gray>— 開草稿並傳送到同一個位置</gray>
  <aqua>/bg publish [--selection]</aqua> <gray>— 預覽併回（點確認才寫入）；--selection 只併回選取範圍</gray>
  <aqua>/bg back</aqua> <gray>— 不併回，回到來源世界</gray>
  <aqua>/bg go <草稿|main></aqua> <gray>— 到某個草稿或主世界</gray>
  <aqua>/bg branch list|create|delete</aqua> <gray>— 管理草稿</gray>
  <gray>存檔與歷史：</gray>
  <aqua>/bg status</aqua> <gray>— 未存的變更</gray>
  <aqua>/bg save [訊息]</aqua> <gray>— 存檔（里程碑）</gray>
  <aqua>/bg log [頁數] [--all] [--author <玩家>]</aqua> <gray>— 存檔歷史</gray>
  <aqua>/bg graph [頁數] [--all]</aqua> <gray>— 分支歷史圖（像 git log --graph）</gray>
  <aqua>/bg show <存檔> [--cells]</aqua> <gray>— 這次存檔改了什麼</gray>
  <aqua>/bg diff [存檔] [存檔]</aqua> <gray>— 在世界裡標出變更</gray>
  <aqua>/bg view <存檔></aqua> <gray>— 唯讀地看舊版本</gray>
  <aqua>/bg inspect</aqua> <gray>／</gray><aqua>/bg blame</aqua> <gray>— 看方塊是誰改的</gray>
  <gray>還原：</gray>
  <aqua>/bg revert <存檔></aqua> <gray>— 撤銷某次存檔，保留之後的變更</gray>
  <aqua>/bg restore <存檔> [--selection]</aqua> <gray>— 把整個分支或選取範圍還原到舊版本</gray>
  <gray>單人世界（用戶端要裝 BuildGit）：</gray>
  <aqua>/bg pull <名稱></aqua> <gray>— 把選取範圍帶到單人世界</gray>
  <aqua>/bg load <名稱></aqua> <gray>— 在單人世界放進取出的範圍</gray>
  <aqua>/bg push <名稱> [草稿]</aqua> <gray>— 把單人世界改過的範圍送回，存成草稿</gray>
  <gray>衝突：</gray>
  <aqua>/bg merge conflicts|goto|take|continue|abort</aqua> <gray>— 處理衝突</gray>
  <gray>其他：</gray>
  <aqua>/bg sel pos1|pos2|show|clear</aqua> <gray>— 選取範圍（有 WorldEdit 時用它的選取）</gray>
  <aqua>/bg who</aqua> <gray>— 誰在哪個草稿</gray>
  <aqua>/bg mark <x1> <y1> <z1> <x2> <y2> <z2></aqua> <gray>— 手動補記一個範圍</gray>
  <aqua>/bg init</aqua> <gray>／</gray><aqua>/bg reload</aqua> <gray>— 管理</gray>
