world-create-body: "<gray>類型只決定天空和環境像原版的哪個維度（地獄：紅色天花板、水會蒸發、床會爆炸；終界：黑色天空、沒有終界龍），每個建築世界都是你自己獨立的世界。規則「建築用」是固定正午與晴天、和平、不生成生物、作物不長、火不蔓延、生物不破壞方塊。大型生態域、巨型化只有主世界類型有。類型、地形、種子建立後不能改。<newline><newline>超平坦的層由下往上寫，用逗號隔開，<white>數量*方塊</white> 是疊幾層，分號後面可以寫生態域；自己寫的層從世界最底下開始疊（主世界 y=-64）。例如：<newline><white>bedrock,2*dirt,grass_block</white>：基岩、2 層泥土、草地<newline><white>bedrock,3*stone,sandstone,sand;desert</white>：沙漠<newline><white>bedrock,124*air,stone</white>：地面在 y=61 的石頭</gray>"
