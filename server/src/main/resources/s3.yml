# S3 connections for BuildGit backups (AWS S3, MinIO, Backblaze B2 and other S3-compatible object storage).
# This file holds keys: do not share it or put it in public version control. Plugin updates never change this file.
# What to back up, how often and how many to keep is set in backup.yml. Run /bg reload after changes; /bg backup status shows the state.
#
# You can have several connections (e.g. another bucket or another provider); jobs in backup.yml pick one with target: s3:<name>.

connections:
  default:
    # The service URL, for example:
    #   AWS: https://s3.ap-northeast-1.amazonaws.com
    #   MinIO: http://127.0.0.1:9000
    #   Backblaze B2: https://s3.us-west-004.backblazeb2.com
    endpoint: ""
    # Region; use us-east-1 for services without regions (MinIO and others)
    region: us-east-1
    bucket: ""
    # Put the bucket in the URL path instead of the host name (needed by MinIO and others)
    path-style: false
    access-key: ""
    secret-key: ""
