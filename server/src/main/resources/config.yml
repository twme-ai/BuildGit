# BuildGit settings. Run /bg reload after changing them (the few marked otherwise need a restart).
# The first part is what you usually adjust; you rarely need to touch anything below "Advanced". Misspelled settings are warned about in the console.

# Message language for the console, and for players whose game language has no lang file (en_us, zh_tw, or your own lang/<code>.yml)
language: en_us
# true: each player sees BuildGit in the language set in their game (when there is a lang file for it); false: everyone sees `language`
language-per-player: true

# Build worlds: one repository per world (docs/03-worlds.md). Players create their own with /bg new;
# admins (buildgit.world.admin) can also create them for others and import worlds on the server (/bg new <name> import <folder> owner <player>).
player-worlds:
  # Whether regular players can create their own build worlds with /bg new (they also need buildgit.world.create). Admins are not limited.
  enabled: false
  # How many build worlds each player can own (not counting ones they are invited to).
  max-per-player: 3
  # The types (overworld, nether, end) and terrains (normal, large-biomes, amplified, flat, void) regular players can pick.
  # Empty allows all; admins are not limited. For example, only superflat and void: allowed-terrain: [flat, void]
  allowed-types: []
  allowed-terrain: []
  # Build worlds that can be used as templates (owner/name), e.g. [admin/spawn-template]. The create menu gets a "Template" terrain;
  # creating from a template forks it (not limited by allowed-types or allowed-terrain, and the template itself may be private).
  templates: []
  # The world border of build worlds (side length of a square centered on (0, 0)), which is also how far visitors can go:
  # adventure-mode visitors are stopped by the border, spectators pass through it and are pulled back when outside.
  border: 1024
  # The largest border owners can set with /bg world settings border.
  max-border: 4096
  # Inventory isolation (on entering, swap to that world's own inventory and starting kit; swap back on leaving):
  #   owner: owners decide for their own worlds (/bg world settings inventory-member, inventory-visitor)
  #   always: isolate in every build world (recommended for survival servers)
  #   never: never isolate, and owners cannot turn it on
  inventory-isolation: owner
  # The initial settings of new worlds; owners can still change them with /bg world settings. Only affects worlds created later.
  defaults:
    # The rules preselected in the create menu: build (always noon, clear weather, peaceful, no mob spawning) or vanilla (like vanilla)
    rules: build
    # public: everyone can come in to look around; private: members only
    visibility: private
    # Members' game mode: creative, survival or adventure
    member-mode: creative
    # Visitors' game mode: spectator or adventure
    visitor-mode: spectator
    # Whether adventure-mode visitors can use buttons, levers, doors and pressure plates
    visitor-interact: false
    # Inventory isolation for members and visitors (only has an effect when inventory-isolation is owner)
    inventory-member: false
    inventory-visitor: false
    # Whether visitors can fork
    allow-fork: true
    # Whether to accept submissions from forked worlds
    accept-submissions: true
    # Players who die in this world respawn at its spawn point (when off, they go back to the server world as in vanilla)
    respawn: true
  # How many days a world stays in the trash after /bg world delete (it can be taken back with /bg world undelete meanwhile) before it is deleted for good.
  trash-days: 7
  # World rules left to other plugins (or vanilla commands): BuildGit does not set them in build worlds, the world settings menu does not list them, and owners cannot change them.
  # You can list time, weather, difficulty, mobs (mob spawning) and nature (crop growth, fire spread,
  # mob griefing and so on). For example, when another plugin controls time and weather: unmanaged-settings: [time, weather]
  # Game rules already set stay in the world and are not reset to vanilla defaults. The server world is never affected by these settings.
  unmanaged-settings: []
  # Upload single-player worlds as new build worlds (/bg new <name> from <save>, needs the BuildGit client). Only the overworld's blocks and entities
  # are taken, without history. The client uploads straight to S3 (the server hands out a presigned URL valid for 15 minutes), then the server downloads it and checks every chunk.
  upload:
    # A connection name from s3.yml; uploads are off when empty. Uploads are staged under uploads/ in the bucket and deleted once processed
    # (a lifecycle rule that deletes uploads/ after a day is recommended, to clear what players leave behind when they quit midway)
    connection: ""
    # The S3 URL players' computers can reach; when empty, the connection's endpoint (fill it in when the endpoint is an internal address like 127.0.0.1)
    public-endpoint: ""
    # Size limit after packing (MB)
    max-mb: 512
  # How many build worlds can be loaded at once; each draft and view world counts as one too (the server world does not). When full, players are asked to try later;
  # empty worlds unload after worlds.unload-idle-seconds.
  max-loaded: 20
  # The server world's name in commands like /bg open; when empty, level-name from server.properties (world by default).
  server-world-name: ""
  # World folder names. {name} is the build world's name (required), {owner-name} the owner's player name (lowercase),
  # {owner} the owner's UUID, {id} the build world's id. A prefix is optional, e.g. "{name}": names are then unique across the whole server.
  # Only affects worlds created later.
  world-name: "bw_{owner-name}_{name}"
  # Folder names of the worlds opened for drafts, conflict resolution and viewing old versions. {world} is the world folder from above, the other placeholders are the same,
  # plus {draft} is the draft name (merge-... for resolution) and {commit} the version id. Drafts and resolution need {draft}, viewing needs {commit},
  # and all need {world} or {id}. A draft remembers its folder when created, so old drafts are still found after you change this. Server world drafts are not affected (bg_<draft>).
  draft-world-name: "{world}-{draft}"
  merge-world-name: "{world}-{draft}"
  view-world-name: "bgview_{world}_{commit}"
  # Where each build world's data goes (relative to the server directory, or absolute). Only affects worlds created later:
  # it is recorded in buildgit/worlds.yml on creation, so old worlds are still found after you change this.
  # Placeholders: {server} the server directory, {buildgit} the server's buildgit/, {id} the build world's id, {owner} the owner's UUID,
  # {world-folder} this world's world folder, {repo} where repo below points.
  # For example, to keep a whole build world inside its world folder (zip one folder to take its history along): repo "{world-folder}/buildgit", objects "{repo}/objects".
  paths:
    # Repository: branches, save records, work area
    repo: "{buildgit}/worlds/{id}"
    # Objects: shared by all build worlds and the server world by default
    objects: "{buildgit}/objects"
    # Genesis world
    genesis: "{repo}/genesis"

worlds:
  # Lobby: when the server world is private (/bg world visibility private), people without permission who are not members are sent here when they join or are removed.
  # A build world (owner/name, must be public), or the name or dimension id of a normal world without version control (e.g. lobby, minecraft:lobby;
  # the admin creates that world with a multiworld plugin). Empty means no lobby, and the server world cannot be private. A build world lobby always stays loaded.
  lobby: ""
  # Worlds that stay loaded: loaded at server start, never unloaded when empty, not counted in player-worlds.max-loaded. Listing many costs memory.
  # Build worlds are "owner/name", drafts "owner/name:draft" (server world drafts "world-name:draft"). They still match after renames and transfers.
  keep-loaded: []
  # Draft and conflict resolution worlds are saved to disk and unloaded from memory after being empty this long (seconds);
  # they reload automatically when someone goes in again (go, try, merge, ...). At least 30 seconds; -1 keeps them in memory.
  unload-idle-seconds: 60

autosave:
  # Save automatically once every player in the world has stopped for this long (seconds). 0 turns it off.
  idle-seconds: 300
  # While people keep building, save at least this often (seconds). 0 turns it off.
  max-interval-seconds: 1800

integrations:
  # Record WorldEdit / FastAsyncWorldEdit edits (the WorldEdit mod on Fabric).
  worldedit: true
  # Record Axiom edits (AxiomPaper on Paper; the Axiom mod on Fabric).
  axiom: true
  # Record DebugStickPro's classic and copy modes; blocks temporarily turned into barriers by freeze mode are not saved.
  debugstickpro: true
  # With LuckPerms installed, provide the contexts buildgit:location (main/draft/view/resolve) and buildgit:branch,
  # so any plugin's permissions can depend on where a player is in BuildGit, e.g. WorldEdit only in drafts:
  #   /lp group builder permission set worldedit.* true buildgit:location=draft
  luckperms-contexts: true

# ───────────────────────────── Advanced: usually no need to change ─────────────────────────────

sync:
  # The most blocks /bg pull takes at once (the area's volume).
  max-blocks: 12000000
  # Without a selection: in a draft, take the area the draft changed (plus 8 blocks); otherwise take this many blocks around the player (horizontal radius, full height).
  radius: 80

init:
  # When a world's save (region and entities) is bigger than this (MB), /bg init does not copy the whole world but copies lazily:
  # each chunk is copied into the genesis world as it is the first time it loads, and chunks never loaded are read from the world's own save.
  # This saves most of the space and init finishes at once, but you must not open the world without BuildGit running (including --forceUpgrade,
  # single-player, and offline tools like MCA Selector), or the genesis of never-loaded chunks gets changed.
  # Default 512; -1 always copies fully, 0 always copies lazily. Only affects worlds initialized later.
  lazy-copy-above-mb: 512
  # Which folder holds the genesis world (relative to the server directory, or absolute); empty means buildgit/genesis.
  # It can go on a cheaper, larger disk: the genesis world is only read when opening drafts, viewing old versions and saving, so it need not be fast.
  # To change it after init: stop the server, move the whole old folder to the new place, then start; until it is moved, the old place keeps being used.
  # Back it up together with buildgit/ and the world folders.
  genesis-dir: ""

# Whose name actions are recorded under.
tracking:
  # The window for knock-on changes (game ticks): after a player changes a block, game changes right next to it within this time (shape updates, water flow, redstone, pistons)
  # are recorded under the same player. Every step in the chain restarts the timer, so long water flows or redstone lines are not cut off.
  cascade-window: 200
  # Knock-on changes farther than this from the start (blocks) are no longer recorded.
  max-distance: 256
  # How often the mark journal is written to disk (game ticks). A crash loses at most this much of the marks.
  journal-flush-ticks: 20
  # Entity types whose own state is not recorded (temporary things).
  ignored-entities:
    - minecraft:item
    - minecraft:experience_orb
    - minecraft:arrow
    - minecraft:spectral_arrow
    - minecraft:trident
    - minecraft:snowball
    - minecraft:egg
    - minecraft:ender_pearl
    - minecraft:splash_potion
    - minecraft:lingering_potion
    - minecraft:experience_bottle
    - minecraft:fireball
    - minecraft:small_fireball
    - minecraft:dragon_fireball
    - minecraft:wither_skull
    - minecraft:firework_rocket
    - minecraft:fishing_bobber
    - minecraft:lightning_bolt
    - minecraft:area_effect_cloud
    - minecraft:falling_block
    - minecraft:tnt
    - minecraft:player
  # Block changes caused by these entities are recorded under the player they are traced to (design §3.4).
  # Regular mobs are left out by default: sheep eating grass or endermen moving blocks should not end up in versions.
  propagating-entities:
    - minecraft:falling_block
    - minecraft:tnt
    - minecraft:tnt_minecart
    - minecraft:arrow
    - minecraft:spectral_arrow
    - minecraft:trident
    - minecraft:snowball
    - minecraft:egg
    - minecraft:splash_potion
    - minecraft:lingering_potion
    - minecraft:fireball
    - minecraft:small_fireball
    - minecraft:wind_charge
    - minecraft:minecart
    - minecraft:end_crystal
